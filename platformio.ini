; Wireless Debugger: ESP32-S3 (Waveshare 4.3") as a WiFi CMSIS-DAP probe for the EK-RA8D1.
; Base config is Saro's known-good setup for this board (N8R8, OPI PSRAM).
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-waveshare-43

[env:esp32-s3-waveshare-43]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -Iinclude

; The Arduino builder hard-codes CORE_DEBUG_LEVEL=0 after our flags; drop it so =3 above wins.
build_unflags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    lvgl/lvgl @ ^8.3.11

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Host-side unit tests (pure C++ modules only): pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Iinclude
