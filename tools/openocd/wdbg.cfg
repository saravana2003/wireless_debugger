# OpenOCD config for the Wireless Debugger: debug only, OpenOCD has no RA8 flash driver.
#   openocd -c "set WDBG_IP 192.168.1.61" -f tools/openocd/wdbg.cfg
# Needs a build with the cmsis-dap TCP backend (xPack 0.12.0-7 or newer).

if { ![info exists WDBG_IP] } { set WDBG_IP 127.0.0.1 }

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host $WDBG_IP
cmsis-dap tcp port 4441
transport select swd
adapter speed 1000

swd newdap wdbg cpu -enable
dap create wdbg.dap -chain-position wdbg.cpu
target create wdbg.cpu cortex_m -dap wdbg.dap
